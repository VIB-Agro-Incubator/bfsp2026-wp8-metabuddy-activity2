name: Build API Docs, redeploy mock servers and tag openAPI versions

on:
  push:
    branches: [main]
    paths:
      - 'openapi/metabuddy-api-minimal.yaml'
      - 'openapi/metabuddy-api-conversational.yaml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Redoc HTML (minimal)
        run: npx @redocly/cli build-docs openapi/metabuddy-api-minimal.yaml --config redocly.yaml -o minimal/index.html
      - name: Build Redoc HTML (conversational)
        run: npx @redocly/cli build-docs openapi/metabuddy-api-conversational.yaml --config redocly.yaml -o conversational/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
      - name: Trigger mock server redeploy (Render)
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_MINIMAL }}"
      - name: Trigger mock server redeploy (Render)
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CONVERSATIONAL }}"

  tag-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        uses: mikefarah/yq@v4.44.3
      - name: Tag minimal spec if version changed
        run: |
          VERSION=$(yq '.info.version' openapi/metabuddy-api-minimal.yaml)
          TAG="minimal-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Tag conversational spec if version changed
        run: |
          VERSION=$(yq '.info.version' openapi/metabuddy-api-conversational.yaml)
          TAG="conversational-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi